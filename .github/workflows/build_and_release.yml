name: Build and Release Luma Mods

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A new push to a pull request cancels its previous run. Each push to main gets its own group, so main runs never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Lists the projects each build cell compiles. Pull requests only build the games they touch,
  # and the x64 cells are split over a few runners (see ".github/scripts/plan-build.ps1").
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2 # on pull requests, HEAD is GitHub's merge commit and HEAD^1 the base branch

    - name: Plan the build cells
      id: plan
      shell: pwsh
      run: ./.github/scripts/plan-build.ps1

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: build (${{ matrix.config }}, ${{ matrix.platform }}, ${{ matrix.shard }})
    # runs-on: windows-2022
    runs-on: windows-2025-vs2026
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1.2

    - name: Integrate vcpkg with MSBuild
      shell: pwsh
      run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'

    - name: Build Luma.sln ${{ matrix.config }}-${{ matrix.platform }} (${{ matrix.shard }})
      shell: pwsh
      env:
        PATHS: ${{ matrix.paths }}
      run: |
        # A solution filter keeps the solution's configurations and project names. It's called "Luma.slnf" so "$(SolutionName)" stays "Luma".
        ConvertTo-Json -Depth 3 @{ solution = @{ path = "Luma.sln"; projects = @($env:PATHS -split ';') } } | Set-Content Luma.slnf
        msbuild Luma.slnf /m /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }} /p:DefineConstants="REMOTE_BUILD=1"
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::warning::MSBuild reported errors for ${{ matrix.config }}-${{ matrix.platform }} - the projects that failed to compile will be excluded from packaging/release (see the 'Create ZIP' step for the exact list)."
          exit 0 # if only one or a few games failed to build, we should still build and package+release the other # TODO: add code to avoid doing an empty release if they all failed to build
        }

    - name: Create ZIP per mod with matching shaders
      id: create_zip
      shell: pwsh
      # We only build publishing and test for now, development builds can be built locally by devs (with the exclusion of the Generic and Graphics Analyzer mod, which can also be used to quickly download a dev/debug environment)
      if: matrix.config == 'Publishing-Release' || matrix.config == 'Test-Release' || matrix.config == 'Development-Release'
      env:
        PROJECTS: ${{ matrix.projects }}
        PATHS: ${{ matrix.paths }}
      run: |
        # Scan vcxproj files to find projects that use NGX (DLSS)
        $ngxProjects = @()
        $coreFastNoiseProjects = @()
        $dxpProjects = @()
        $vcxprojFiles = Get-ChildItem -Path "Source/Games" -Filter "*.vcxproj" -Recurse
        foreach ($vcxproj in $vcxprojFiles) {
          $content = Get-Content $vcxproj.FullName -Raw
          $projectName = [System.IO.Path]::GetFileNameWithoutExtension($vcxproj.Name)
          if ($content -match '<UseLumaNGX>\s*true\s*</UseLumaNGX>') {
            $ngxProjects += $projectName
            Write-Host "Found NGX feature-enabled project: $projectName"
          }
          if ($content -match '<UseLumaFastNoise>\s*true\s*</UseLumaFastNoise>') {
            $coreFastNoiseProjects += $projectName
            Write-Host "Found Core FAST texture opt-in project: $projectName"
          }
          if ($content -match '<UseLumaDXP>\s*true\s*</UseLumaDXP>') {
            $dxpProjects += $projectName
            Write-Host "Found DXP project: $projectName"
          }
        }
        Write-Host "NGX projects: $($ngxProjects -join ', ')"
        Write-Host "Core FAST texture projects: $($coreFastNoiseProjects -join ', ')"
        Write-Host "DXP projects: $($dxpProjects -join ', ')"

        # The mods this cell built (the projects listed by the plan job): each game builds "dxgi.dll" into
        # "Binaries\<platform>-<config>\<ProjectName>\". A missing one failed to build.
        $cellProjects = $env:PROJECTS -split ';'
        $cellPaths = $env:PATHS -split ';'
        $builtMods = @()
        $missingProjects = @()
        for ($i = 0; $i -lt $cellPaths.Count; $i++) {
          $vcxPath = Join-Path (Get-Location) $cellPaths[$i]
          if (-not (Test-Path $vcxPath)) { continue }
          $vcxContent = Get-Content $vcxPath -Raw
          # Core and the tools (SR Bridge Helper) build too, but aren't mods
          if ($vcxContent -notmatch '<TargetName[^>]*>dxgi<') { continue }
          $projName = $cellProjects[$i]
          if ($vcxContent -match '<ProjectName>([^<]+)</ProjectName>') { $projName = $Matches[1] }
          $projName = $projName -replace '&amp;', '&' -replace '&lt;', '<' -replace '&gt;', '>' -replace '&quot;', '"'
          $dllPath = Join-Path (Get-Location) "Binaries\${{ matrix.platform }}-${{ matrix.config }}\$projName\dxgi.dll"
          if (Test-Path -LiteralPath $dllPath) {
            $builtMods += [pscustomobject]@{ Name = $projName; Dll = $dllPath }
          } else {
            $missingProjects += $projName
          }
        }
        Write-Host "Mods built for this configuration: $($builtMods.Count), failed: $($missingProjects.Count)"

        $results = [ordered]@{}
        foreach ($mod in $builtMods) { $results[$mod.Name] = "✅ Built" }
        foreach ($projName in $missingProjects) { $results[$projName] = "❌ Failed to build" }
        function Write-Summary {
          $summary = @("### ${{ matrix.config }}-${{ matrix.platform }} (${{ matrix.shard }})", "", "| Game | Result |", "| --- | --- |")
          foreach ($name in ($results.Keys | Sort-Object)) { $summary += "| $name | $($results[$name]) |" }
          $summary += ""
          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY
        }

        if ($builtMods.Count -eq 0) {
          Write-Host "No mods found."
          Write-Summary
          "skip_upload=true" >> $env:GITHUB_OUTPUT
          exit 0
        }

        "skip_upload=false" >> $env:GITHUB_OUTPUT

        if ($missingProjects.Count -gt 0) {
          $warningMessage = "Projects that failed to build (excluded from this release): $($missingProjects -join ', ')"
          Write-Host ("::warning::" + ($warningMessage -replace '%', '%25' -replace ',', '%2C' -replace ':', '%3A'))
        }

        $packagedCount = 0
        foreach ($mod in $builtMods) {
          # Some projects (e.g. template, generic mod etc) have an underscore in front of them to appear on top in alphabetical order
          $projectName = $mod.Name -replace '^_', ''
          $zipName = "Luma-$projectName"
          # Add "Test" tag for test builds
          if ("${{ matrix.config }}" -eq "Test-Release") {
            $zipName += "-Test"
          }
          # Add "Dev" tag for developments builds
          if ("${{ matrix.config }}" -eq "Development-Release") {
            $zipName += "-Dev"
          }
          if ("${{ matrix.config }}" -eq "Development-Debug") {
            $zipName += "-Dev-Dbg"
          }
          # Avoid naming conflicts if mods have both x64 and x32 versions
          if ("${{ matrix.platform }}" -eq "Win32") {
            $zipName += "-x32"
          }
          # Turn spaces into another nice looking character, given that the github release will replace them with a '.', which is more weird
          $zipName = $zipName -replace ' ', '_'
          $zipName += ".zip"

          Write-Host "Project name extracted: $projectName"

          # TODO: remove "_" from "Generic Mod"
          # We don't care to publish the template project, it's just there for reference
          if ($projectName -like '_Template' -or $projectName -like 'Template') {
            Write-Host "Project is a template. Skipping ZIP creation and upload."
            continue
          }
          # Allow the Generic and Graphics Analyzer mods to be downloaded directly
          elseif ("${{ matrix.config }}".StartsWith("Development") -and -not (
                   $projectName -like '_Generic' -or
                   $projectName -like 'Generic' -or
                   $projectName -like '_Generic Mod' -or
                   $projectName -like 'Generic Mod' -or
                   $projectName -like 'Graphics Analyzer'
                 )) {
            continue
          }

          #if ($projectName -like '*Prey*') {
          #  Write-Host "Note that Prey automated packaging isn't the whole Luma mod, that needs manual packaging as it comes with extra files."
          #}

          # Package with the shared script (single source of truth with local packaging):
          # it copies only this game's shaders, Global and Includes, skipping game
          # Dump directories before traversal and excluding all .cso files. It bundles the mod's
          # dxgi.dll and the runtime DLLs (d3dcompiler_47, NGX DLSS...) and zips into -OutDir.
          # dxcompiler.dll is intentionally not shipped (SM5-only).
          pwsh -ExecutionPolicy Bypass -File "Scripts/package.ps1" -Project $projectName -Config "${{ matrix.config }}" -Platform "${{ matrix.platform }}" -AddonPath $mod.Dll -OutDir "."
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Packaging failed for '$projectName' - it will be excluded from this release."
            $results[$mod.Name] = "⚠️ Built, packaging failed"
            continue
          }
          $results[$mod.Name] = "✅ Packaged"
          $packagedCount++

          #"zipfile=$zipName" >> $env:GITHUB_OUTPUT
          #"skip_upload=false" >> $env:GITHUB_OUTPUT
        }

        Write-Summary

        # Skip the upload if nothing was packaged (last write wins on GITHUB_OUTPUT)
        if ($packagedCount -eq 0) {
          Write-Host "::warning::No projects were packaged successfully for ${{ matrix.config }}-${{ matrix.platform }} - skipping the upload for this configuration."
          "skip_upload=true" >> $env:GITHUB_OUTPUT
        }

    - name: Upload ZIP
      if: (matrix.config == 'Publishing-Release' || matrix.config == 'Test-Release' || matrix.config == 'Development-Release') && steps.create_zip.outputs.skip_upload != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Package-${{ matrix.config }}-${{ matrix.platform }}-${{ matrix.shard }}
        #path: ${{ steps.create_zip.outputs.zipfile }}
        path: |
          Luma-*.zip
        compression-level: 0 # the zips are already compressed

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Don't run this on PRs but only on push, otherwise it will fail to upload release files
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Package-*
          merge-multiple: true  # puts all files in a single folder

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.run_number }}
          name: Release (Build ${{ github.run_number }})
          body: |
            The current version of all Luma mods (based on latest commit).
            
            Installation instructions:
            - Extract all the files directly in the game main executable folder (replace the previous ones if you are updating)
            - Luma is the "dxgi.dll" file: if you already had another dxgi.dll (e.g. ReShade or other mods), it will be replaced, back it up first
            - Boot the game
            - Press Insert to bring out the Luma menu (if it doesn't appear, Luma failed to install or run)
            - Customize the settings if you'd like, the defaults are already good and pick up on your display calibration
            - **(Linux only)** install msvcrt40 and vcrun2022 using protontricks

            Note that not all mods here are playable, some are work in progress. Consult the wiki mod list for their state, or ask in "HDR Den" discord for more information.
            Note that some mods here might not be complete, like "Prey", which misses (optional) data for the rest of the mod, these should be downloaded from Nexus.
            "Test" mods are made to be tested and have tools to investigate what's going on, and help the developers gather information.
            The "Generic" mod will work in many games out of the box, especially if you pair it with a separate Auto HDR upgrade method.
            Proton should be fully compatible out of the box.

            ---

            Last commit: ${{ github.event.head_commit.message }}
          files: |
            Luma-*.zip
